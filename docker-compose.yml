services:
  postgres:
    image: postgres:18-alpine
    container_name: messenger-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-didok362}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qwerty67}
      POSTGRES_DB: ${POSTGRES_DB:-messenger_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-didok362} -d ${POSTGRES_DB:-messenger_db}"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  messenger:
    image: ghcr.io/didok362/messenger:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: messenger-app
    environment:
      HTTP_PORT: ${HTTP_PORT:-8080}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-didok362}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qwerty67}
      POSTGRES_DB: ${POSTGRES_DB:-messenger_db}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key}
      JWT_TTL: ${JWT_TTL:-24h}
      ASSETS_DIR: assets/avatars
      WEB_DIR: web
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    

  migrate:
    image: gomicro/goose:latest
    container_name: messenger-migrate
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - goose
      - -dir
      - /migrations
      - postgres
      - "postgres://${POSTGRES_USER:-didok362}:${POSTGRES_PASSWORD:-qwerty67}@postgres:5432/${POSTGRES_DB:-messenger_db}?sslmode=disable"
      - up

  caddy:
    image: caddy:alpine
    container_name: messenger-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command: caddy reverse-proxy --from leclochard.duckdns.org --to messenger:8080

  redis:
    image: redis:7-alpine
    container_name: messenger-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: messenger-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: messenger-grafana
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
volumes:
  pgdata: 
  caddy_data:
  caddy_config:
  grafana_data: