<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Go Messenger Enterprise</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden font-sans select-none">

  <!-- 1. ЭКРАН АВТОРИЗАЦИИ / РЕГИСТРАЦИИ -->
  <div id="auth-screen" style="display: flex;" class="items-center justify-center h-full p-4">
    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-2xl max-w-sm w-full flex flex-col gap-4">
      <div class="text-center">
        <h1 class="text-2xl font-bold text-blue-500 tracking-tight">⚡ Go Messenger</h1>
        <p class="text-xs text-slate-400 mt-1">Enterprise Architecture MVP</p>
      </div>

      <!-- Переключатель Вход / Регистрация -->
      <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
        <button id="tab-login-btn" onclick="setAuthTab('login')" class="flex-1 py-1.5 rounded-lg bg-blue-600 text-white transition">Вход</button>
        <button id="tab-reg-btn" onclick="setAuthTab('register')" class="flex-1 py-1.5 rounded-lg text-slate-400 hover:text-white transition">Регистрация</button>
      </div>

      <div id="auth-error" class="hidden text-xs text-red-400 bg-red-950/40 border border-red-900/50 p-2.5 rounded-xl text-center"></div>

      <!-- Форма Входа -->
      <form id="login-form" onsubmit="handleLogin(event)" class="flex flex-col gap-3">
        <div>
          <label class="text-[11px] text-slate-400 block mb-1">Username (никнейм)</label>
          <input id="login-username" type="text" required placeholder="alex_pro" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 transition">
        </div>
        <div>
          <label class="text-[11px] text-slate-400 block mb-1">Пароль</label>
          <input id="login-password" type="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 transition">
        </div>
        <button type="submit" class="mt-2 bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl text-xs font-bold transition shadow-lg shadow-blue-600/20">
          Войти
        </button>
      </form>

      <!-- Форма Регистрации -->
      <form id="register-form" onsubmit="handleRegister(event)" class="hidden flex-col gap-3">
        <div>
          <label class="text-[11px] text-slate-400 block mb-1">Username (никнейм)</label>
          <input id="reg-username" type="text" required placeholder="alex_pro" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 transition">
        </div>
        <div>
          <label class="text-[11px] text-slate-400 block mb-1">Email</label>
          <input id="reg-email" type="email" required placeholder="alex@test.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 transition">
        </div>
        <div>
          <label class="text-[11px] text-slate-400 block mb-1">Пароль</label>
          <input id="reg-password" type="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 transition">
        </div>
        <button type="submit" class="mt-2 bg-green-600 hover:bg-green-500 text-white py-2.5 rounded-xl text-xs font-bold transition shadow-lg shadow-green-600/20">
          Зарегистрироваться
        </button>
      </form>
    </div>
  </div>

  <!-- 2. ГЛАВНЫЙ ЭКРАН (САЙДБАР СЛЕВА + ЧАТ СПРАВА) -->
  <div id="main-screen" style="display: none;" class="h-full w-full flex-col md:flex-row overflow-hidden">
    
    <!-- ЛЕВАЯ КОЛОНКА (САЙДБАР) -->
    <div id="sidebar" class="w-full md:w-80 bg-slate-900 border-r border-slate-800 flex flex-col h-full flex-shrink-0">
      
      <!-- Профиль текущего пользователя -->
      <div class="p-3.5 border-b border-slate-800 flex justify-between items-center bg-slate-900/90">
        <div class="flex items-center gap-2.5">
          <div class="relative flex-shrink-0">
            <img id="avatar-badge" class="w-10 h-10 rounded-full object-cover bg-slate-800 border border-slate-700 shadow-sm" alt="My Avatar">
            <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full border-2 border-slate-900 bg-emerald-500"></span>
          </div>
          <div class="text-sm font-bold leading-tight text-slate-100" id="user-badge">user</div>
        </div>
        <button onclick="logout()" class="text-xs text-slate-400 hover:text-red-400 px-2 py-1 rounded-lg hover:bg-slate-800 transition">Выйти</button>
      </div>

      <!-- Панель создания чатов -->
      <div class="p-3 border-b border-slate-800 bg-slate-950/40 flex flex-col gap-2">
        <div class="flex gap-1 bg-slate-950 p-0.5 rounded-lg border border-slate-800 text-[11px] font-medium">
          <button id="mode-direct-btn" onclick="setCreateMode('direct')" class="flex-1 py-1 rounded bg-blue-600 text-white transition">Личный чат</button>
          <button id="mode-group-btn" onclick="setCreateMode('group')" class="flex-1 py-1 text-slate-400 hover:text-white transition">Группа</button>
        </div>

        <!-- Создание личного чата -->
        <form id="create-direct-form" onsubmit="handleCreateDirect(event)" class="flex gap-1.5">
          <input id="direct-username-input" type="text" required placeholder="Никнейм собеседника (например bob)" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
          <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">Начать</button>
        </form>

        <!-- Создание группового чата -->
        <form id="create-group-form" onsubmit="handleCreateGroup(event)" class="hidden flex-col gap-1.5">
          <input id="group-title-input" type="text" required placeholder="Название группы..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
          <div class="flex gap-1.5">
            <input id="group-members-input" type="text" required placeholder="Участники: alice, bob" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
            <button type="submit" class="bg-green-600 hover:bg-green-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">Создать</button>
          </div>
        </form>
      </div>

      <!-- Список диалогов -->
      <div class="flex-1 overflow-y-auto flex flex-col p-2 gap-1.5" id="chat-list">
        <div class="text-xs text-slate-500 text-center my-4">Загрузка диалогов...</div>
      </div>
    </div>

    <!-- ПРАВАЯ КОЛОНКА (ОКНО ЧАТА) -->
    <div id="chat-area" class="flex-1 flex flex-col h-full bg-slate-950 overflow-hidden">
      
      <!-- Шапка активного чата -->
      <div class="p-3 bg-slate-900/80 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button onclick="showSidebarOnMobile()" class="md:hidden text-xs text-blue-400 hover:underline">← Чаты</button>
          <div class="flex flex-col justify-center">
            <div id="active-chat-title" class="text-sm font-semibold text-slate-100 leading-tight">Выберите диалог</div>
            <div id="active-chat-status" class="text-[11px] font-normal text-slate-400 mt-0.5 hidden"></div>
          </div>
        </div>
      </div>

      <!-- Лента сообщений -->
      <div id="messages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2.5 select-text">
        <div class="text-xs text-slate-500 text-center my-auto">Выберите чат в меню слева!</div>
      </div>

      <!-- Поле ввода -->
      <form onsubmit="sendMessage(event)" class="p-3 bg-slate-900 border-t border-slate-800 flex gap-2">
        <input id="msg-input" type="text" placeholder="Напишите сообщение..." autocomplete="off" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
        <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-5 rounded-xl font-medium text-sm transition shadow-lg shadow-blue-600/20">Отправить</button>
      </form>
    </div>

  </div>

  <script>
    let token = localStorage.getItem('token');
    let currentUser = localStorage.getItem('username') || '';
    let currentChatId = null;
    let currentPartnerId = null;
    let currentChatType = 'direct';
    let ws = null;

    function updateHeaderStatus(isOnline) {
      const statusEl = document.getElementById('active-chat-status');
      if (!currentPartnerId) {
        statusEl.className = 'text-[11px] font-normal hidden';
        statusEl.innerHTML = '';
        return;
      }
      statusEl.className = 'text-[11px] font-normal flex items-center gap-1.5 mt-0.5';
      if (isOnline) {
        statusEl.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500/50"></span><span class="text-emerald-400 font-medium leading-none">в сети</span>';
      } else {
        statusEl.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-slate-500"></span><span class="text-slate-400 leading-none">не в сети</span>';
      }
    }

    function getMyId() {
      if (!token) return null;
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        return payload.sub;
      } catch (e) {
        return null;
      }
    }

    if (token && currentUser) {
      showApp();
    } else {
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('main-screen').style.display = 'none';
    }

    function setAuthTab(tab) {
      const loginForm = document.getElementById('login-form');
      const regForm = document.getElementById('register-form');
      const loginBtn = document.getElementById('tab-login-btn');
      const regBtn = document.getElementById('tab-reg-btn');
      const errBox = document.getElementById('auth-error');
      errBox.classList.add('hidden');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        loginForm.classList.add('flex');
        regForm.classList.add('hidden');
        regForm.classList.remove('flex');
        loginBtn.className = 'flex-1 py-1.5 rounded-lg bg-blue-600 text-white transition';
        regBtn.className = 'flex-1 py-1.5 rounded-lg text-slate-400 hover:text-white transition';
      } else {
        regForm.classList.remove('hidden');
        regForm.classList.add('flex');
        loginForm.classList.add('hidden');
        loginForm.classList.remove('flex');
        regBtn.className = 'flex-1 py-1.5 rounded-lg bg-green-600 text-white transition';
        loginBtn.className = 'flex-1 py-1.5 rounded-lg text-slate-400 hover:text-white transition';
      }
    }

    function showAuthError(msg) {
      const errBox = document.getElementById('auth-error');
      errBox.innerText = msg;
      errBox.classList.remove('hidden');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value.trim();

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (!res.ok) {
          const text = await res.text();
          return showAuthError(text || 'Неверный никнейм или пароль');
        }

        const data = await res.json();
        token = data.token;
        currentUser = (data.user && data.user.username) ? data.user.username : username;
        localStorage.setItem('token', token);
        localStorage.setItem('username', currentUser);
        showApp();
      } catch (err) {
        showAuthError('Ошибка сети: ' + err.message);
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value.trim();

      try {
        const res = await fetch('/api/v1/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });

        if (!res.ok) {
          const text = await res.text();
          return showAuthError(text || 'Ошибка регистрации');
        }

        // После успешной регистрации сразу логиним по юзернейму
        const loginRes = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const loginData = await loginRes.json();
        token = loginData.token;
        currentUser = (loginData.user && loginData.user.username) ? loginData.user.username : username;
        localStorage.setItem('token', token);
        localStorage.setItem('username', currentUser);
        showApp();
      } catch (err) {
        showAuthError('Ошибка сети: ' + err.message);
      }
    }

    function setCreateMode(mode) {
      const directForm = document.getElementById('create-direct-form');
      const groupForm = document.getElementById('create-group-form');
      const directBtn = document.getElementById('mode-direct-btn');
      const groupBtn = document.getElementById('mode-group-btn');

      if (mode === 'direct') {
        directForm.classList.remove('hidden');
        directForm.classList.add('flex');
        groupForm.classList.add('hidden');
        groupForm.classList.remove('flex');
        directBtn.className = 'flex-1 py-1 rounded bg-blue-600 text-white transition';
        groupBtn.className = 'flex-1 py-1 text-slate-400 hover:text-white transition';
      } else {
        groupForm.classList.remove('hidden');
        groupForm.classList.add('flex');
        directForm.classList.add('hidden');
        directForm.classList.remove('flex');
        groupBtn.className = 'flex-1 py-1 rounded bg-green-600 text-white transition';
        directBtn.className = 'flex-1 py-1 text-slate-400 hover:text-white transition';
      }
    }

    function showApp() {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('main-screen').style.display = 'flex';
      document.getElementById('user-badge').innerText = currentUser || 'user';
      const myId = getMyId();
      if (myId) {
        document.getElementById('avatar-badge').src = `/api/v1/users/${myId}/avatar`;
      }
      connectWS();
      loadChats(true);
    }

    function logout() {
      localStorage.clear();
      location.reload();
    }

    function showSidebarOnMobile() {
      document.getElementById('sidebar').style.display = 'flex';
      document.getElementById('chat-area').style.display = 'none';
    }

    // Загрузка списка диалогов
    async function loadChats(autoSelectFirst = false) {
      try {
        const res = await fetch('/api/v1/chats', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) return;

        const data = await res.json();
        const chats = data.chats || [];
        const list = document.getElementById('chat-list');

        if (!Array.isArray(chats) || chats.length === 0) {
          list.innerHTML = '<div class="text-xs text-slate-500 text-center my-4">Нет чатов. Создайте диалог сверху!</div>';
          return;
        }

        list.innerHTML = '';
        chats.forEach((chat, idx) => {
          const item = document.createElement('div');
          const isSelected = chat.id === currentChatId;
          const isGroup = chat.type === 'group';
          const title = isGroup ? `👥 ${chat.title || 'Группа'}` : `${chat.title || 'Собеседник'}`;

          const avatarUrl = isGroup
            ? `https://api.dicebear.com/7.x/identicon/svg?seed=${chat.id}`
            : `/api/v1/users/${chat.direct_user_id || chat.id}/avatar`;

          let previewText = 'Пока нет сообщений';
          let previewTime = '';
          if (chat.last_message) {
            // Автора пишем только в группах. В личных диалогах пишем чистый текст:
            const sender = (isGroup && chat.last_message.sender_username) ? `${chat.last_message.sender_username}: ` : '';
            previewText = `${sender}${chat.last_message.content}`;
            if (chat.last_message.created_at) {
              previewTime = new Date(chat.last_message.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
          }

          const unreadBadge = (chat.unread_count > 0 && !isSelected) 
            ? `<span class="bg-blue-500 text-white font-bold text-[10px] px-1.5 py-0.5 rounded-full flex-shrink-0">${chat.unread_count}</span>` 
            : '';

          item.setAttribute('data-chat-id', chat.id);
          if (chat.direct_user_id) {
            item.setAttribute('data-partner-id', chat.direct_user_id);
          }
          item.className = `p-2 rounded-xl cursor-pointer transition border flex items-center gap-3 ${
            isSelected ? 'bg-blue-600/30 border-blue-500 shadow-sm' : 'bg-slate-900 hover:bg-slate-800 border-slate-800'
          }`;
          item.innerHTML = `
            <div class="relative flex-shrink-0">
              <img src="${avatarUrl}" class="w-12 h-12 rounded-full object-cover bg-slate-800 border border-slate-700 shadow-sm" alt="Avatar">
              ${!isGroup ? `<span class="absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-slate-900 ${chat.is_online ? 'bg-emerald-500' : 'bg-slate-600'}"></span>` : ''}
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-2">
                <span class="font-bold text-sm text-slate-200 truncate">${title}</span>
                <span class="text-[10px] text-slate-400 font-mono flex-shrink-0">${previewTime}</span>
              </div>
              <div class="flex items-center justify-between gap-2 mt-0.5">
                <div class="text-xs text-slate-400 truncate">${previewText}</div>
                ${unreadBadge}
              </div>
            </div>
          `;
          item.onclick = () => selectChat(chat.id, title, chat.direct_user_id, chat.is_online, chat.type);
          list.appendChild(item);
        });

        if (autoSelectFirst && !currentChatId && chats.length > 0) {
          const first = chats[0];
          selectChat(first.id, first.type === 'group' ? `👥 ${first.title || 'Группа'}` : `${first.title || 'Собеседник'}`, first.direct_user_id, first.is_online, first.type);
        }
      } catch (err) {
        console.error('Ошибка загрузки чатов:', err);
      }
    }

    // Создание личного чата
    async function handleCreateDirect(e) {
      e.preventDefault();
      const input = document.getElementById('direct-username-input');
      const targetUsername = input.value.trim();
      if (!targetUsername) return;

      try {
        // 1. Enterprise User Lookup
        const userRes = await fetch(`/api/v1/users/by-username?username=${encodeURIComponent(targetUsername)}`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!userRes.ok) {
          return alert(`Пользователь @${targetUsername} не найден!`);
        }
        const userData = await userRes.json();
        const targetUserId = userData.user.id;

        // 2. Создание или получение существующего диалога
        const res = await fetch('/api/v1/chats/direct', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ target_user_id: targetUserId })
        });

        if (!res.ok) {
          const err = await res.text();
          return alert('Ошибка создания чата: ' + err);
        }

        const data = await res.json();
        input.value = '';
        await loadChats(false);
        selectChat(data.chat.id, targetUsername, targetUserId, false, 'direct');
      } catch (err) {
        alert('Ошибка сети: ' + err.message);
      }
    }

    // Создание группового чата
    async function handleCreateGroup(e) {
      e.preventDefault();
      const titleInput = document.getElementById('group-title-input');
      const membersInput = document.getElementById('group-members-input');
      const title = titleInput.value.trim();
      const rawUsernames = membersInput.value.split(',').map(s => s.trim()).filter(Boolean);

      if (!title) return alert('Укажите название группы!');
      if (rawUsernames.length === 0) return alert('Укажите хотя бы одного участника!');

      try {
        // 1. Резолвим UUID всех участников через /users/by-username
        const memberIds = [];
        for (const u of rawUsernames) {
          const userRes = await fetch(`/api/v1/users/by-username?username=${encodeURIComponent(u)}`, {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          if (!userRes.ok) {
            return alert(`Участник @${u} не найден в системе!`);
          }
          const userData = await userRes.json();
          memberIds.push(userData.user.id);
        }

        // 2. Создаем группу
        const res = await fetch('/api/v1/chats/group', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({
            title: title,
            member_ids: memberIds
          })
        });

        if (!res.ok) {
          const err = await res.text();
          return alert('Ошибка создания группы: ' + err);
        }

        const data = await res.json();
        titleInput.value = '';
        membersInput.value = '';
        await loadChats(false);
        selectChat(data.chat.id, `👥 ${title}`, null, false, 'group');
      } catch (err) {
        alert('Ошибка сети: ' + err.message);
      }
    }

    // Выбор чата
    async function selectChat(chatId, title = 'Диалог', partnerId = null, isOnline = false, chatType = 'direct') {
      currentChatId = chatId;
      currentPartnerId = partnerId;
      currentChatType = chatType;
      document.getElementById('active-chat-title').innerText = title;
      updateHeaderStatus(isOnline);

      // Мгновенная подсветка активного чата в сайдбаре
      document.querySelectorAll('#chat-list > div').forEach(el => {
        const isCurrent = el.getAttribute('data-chat-id') === chatId;
        el.className = `p-2 rounded-xl cursor-pointer transition border flex items-center gap-3 ${
          isCurrent ? 'bg-blue-600/30 border-blue-500 shadow-sm' : 'bg-slate-900 hover:bg-slate-800 border-slate-800'
        }`;
      });

      // Отправляем сигнал прочтения и обновляем сайдбар
      await fetch(`/api/v1/chats/${chatId}/read`, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      await loadChats(false);

      if (window.innerWidth < 768) {
        document.getElementById('sidebar').style.display = 'none';
        document.getElementById('chat-area').style.display = 'flex';
      }

      const messagesBox = document.getElementById('messages');
      messagesBox.innerHTML = '<div class="text-xs text-slate-500 text-center my-auto">Загрузка переписки...</div>';

      try {
        const res = await fetch(`/api/v1/chats/${chatId}/messages`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        messagesBox.innerHTML = '';
        if (res.ok) {
          const data = await res.json();
          const msgs = data.messages || [];
          if (Array.isArray(msgs) && msgs.length > 0) {
            msgs.forEach(appendMessage);
          } else {
            messagesBox.innerHTML = '<div class="text-xs text-slate-500 text-center my-auto">Сообщений пока нет. Напишите первым!</div>';
          }
        }
      } catch (err) {
        console.error('Ошибка сообщений:', err);
      }
    }

    // WebSocket подключение
    function connectWS() {
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${window.location.host}/api/v1/ws?token=${token}`);

      ws.onmessage = async (event) => {
        const data = JSON.parse(event.data);

        // 1. Событие: статус пользователя (Online / Offline)
        if (data.type === 'user_status') {
          if (currentPartnerId === data.user_id) {
            updateHeaderStatus(data.is_online);
          }
          await loadChats(false);
          return;
        }

        // 2. Событие: кто-то прочитал сообщения в чате
        if (data.type === 'messages_read') {
          if (data.chat_id === currentChatId) {
            document.querySelectorAll('#messages .msg-status').forEach(el => {
              el.innerText = '✓✓';
              el.className = 'msg-status font-mono ml-0.5 text-cyan-300 font-bold';
              el.title = 'Прочитано';
            });
          }
          return;
        }

        // 2. Входящее сообщение
        const msg = data;
        if (msg.chat_id === currentChatId) {
          appendMessage(msg);
          if (msg.sender_id !== getMyId()) {
            await fetch(`/api/v1/chats/${msg.chat_id}/read`, {
              method: 'POST',
              headers: { 'Authorization': 'Bearer ' + token }
            });
          }
        }
        await loadChats(false);
      };
      ws.onclose = () => setTimeout(connectWS, 2000);
    }

    // Отрисовка сообщения
    // Безопасный парсинг ссылок и текста без риска XSS
    function renderFormattedText(container, content, isMe) {
      if (!content) return [];
      const foundUrls = [];
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      const parts = content.split(urlRegex);
      parts.forEach(part => {
        if (part.match(/^https?:\/\//)) {
          let url = part;
          let trailingPunct = '';
          const punctMatch = url.match(/([.,!?:;)]+)$/);
          if (punctMatch) {
            trailingPunct = punctMatch[1];
            url = url.slice(0, -trailingPunct.length);
          }

          const a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.className = isMe 
            ? 'underline font-medium text-cyan-200 hover:text-white break-all select-text cursor-pointer' 
            : 'underline font-medium text-blue-400 hover:text-blue-300 break-all select-text cursor-pointer';
          a.innerText = url;
          a.onclick = (e) => e.stopPropagation();
          container.appendChild(a);

          foundUrls.push(url);

          if (trailingPunct) {
            container.appendChild(document.createTextNode(trailingPunct));
          }
        } else if (part) {
          container.appendChild(document.createTextNode(part));
        }
      });
      return foundUrls;
    }

    // Встраивание превью для картинок и медиа (eblo.id, imgur, youtube, прямые картинки)
    function attachMediaPreviews(bubble, metaSpan, urls) {
      urls.forEach(url => {
        try {
          const u = new URL(url);
          const host = u.hostname.toLowerCase();
          const pathname = u.pathname;

          let previewUrl = null;
          let isImgurPost = false;
          let imgurId = null;

          // 1. YouTube
          if (host === 'youtu.be') {
            const id = pathname.slice(1).split('/')[0].split('?')[0];
            if (id) previewUrl = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
          } else if (host.includes('youtube.com')) {
            const id = u.searchParams.get('v');
            if (id) previewUrl = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
          }

          // 2. eblo.id (посты вида eblo.id/TR55khS или прямые uploads)
          else if (host.includes('eblo.id')) {
            if (pathname.includes('/uploads/')) {
              previewUrl = url;
            } else {
              const code = pathname.replace(/^\//, '').split('/')[0];
              if (code && /^[a-zA-Z0-9_-]+$/.test(code)) {
                previewUrl = `https://eblo.id/uploads/thumbs/${code}_thumb.webp`;
              }
            }
          }

          // 3. Imgur (прямые i.imgur.com или посты/галереи imgur.com/gallery/...)
          else if (host.includes('imgur.com')) {
            if (host === 'i.imgur.com' && /\.(jpe?g|png|gif|webp)$/i.test(pathname)) {
              previewUrl = url;
            } else {
              const segments = pathname.split('/').filter(Boolean);
              if (segments.length > 0) {
                const last = segments[segments.length - 1];
                const parts = last.split('-');
                const id = parts[parts.length - 1];
                if (/^[a-zA-Z0-9]+$/.test(id)) {
                  imgurId = id;
                  isImgurPost = true;
                }
              }
            }
          }

          // 4. Прямые ссылки на изображения по расширению
          else if (/\.(png|jpe?g|gif|webp|svg)($|\?)/i.test(pathname)) {
            previewUrl = url;
          }

          if (!previewUrl && !isImgurPost) return;

          const img = document.createElement('img');
          img.referrerPolicy = 'no-referrer';
          img.className = 'mt-2 rounded-xl max-h-64 max-w-full object-contain block bg-slate-900/60 border border-slate-700/60 cursor-pointer hover:opacity-95 transition shadow-sm';
          img.alt = 'Preview';
          img.title = 'Нажмите, чтобы открыть оригинал';
          img.onclick = (e) => {
            e.stopPropagation();
            window.open(url, '_blank');
          };

          img.onload = () => {
            metaSpan.className = 'absolute bottom-1.5 right-2.5 inline-flex items-center gap-1 text-[10px] select-none font-mono leading-none bg-black/60 backdrop-blur-sm px-2 py-0.5 rounded-full text-white shadow-sm';
            const box = document.getElementById('messages');
            if (box) box.scrollTop = box.scrollHeight;
          };

          img.onerror = () => {
            img.remove();
          };

          if (isImgurPost && imgurId) {
            // Для постов и галерей Imgur запрашиваем cover_id через публичный API Imgur (CORS разрешен)
            fetch(`https://api.imgur.com/post/v1/posts/${imgurId}?client_id=546c25a59c58ad7`)
              .then(res => res.json())
              .then(data => {
                const cover = data.cover_id || data.id;
                if (cover) {
                  img.src = `https://i.imgur.com/${cover}.jpg`;
                } else {
                  img.remove();
                }
              })
              .catch(() => {
                img.src = `https://i.imgur.com/${imgurId}.jpg`;
              });
          } else if (previewUrl) {
            img.src = previewUrl;
          }

          bubble.appendChild(img);
        } catch (e) {}
      });
    }

    function appendMessage(msg) {
      const container = document.getElementById('messages');
      if (container.children.length === 1 && container.children[0].innerText.includes('Сообщений пока нет')) {
        container.innerHTML = '';
      }

      const myId = getMyId();
      const isMe = msg.sender_id === myId;
      const timeStr = msg.created_at ? new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      const avatarUrl = msg.sender_id ? `/api/v1/users/${msg.sender_id}/avatar` : `https://api.dicebear.com/7.x/identicon/svg?seed=${msg.sender_username || 'user'}`;

      // Общий контейнер сообщения со сдвигом влево/вправо
      const row = document.createElement('div');
      row.className = `flex items-end gap-2 max-w-[85%] ${isMe ? 'ml-auto justify-end' : 'mr-auto justify-start'}`;

      // Аватарка отправителя
      const avatar = document.createElement('img');
      avatar.src = avatarUrl;
      avatar.className = `w-8 h-8 rounded-full object-cover flex-shrink-0 mb-0.5 bg-slate-800 border ${
        isMe ? 'border-blue-500/40' : 'border-slate-700'
      } shadow-sm`;
      avatar.alt = 'Avatar';

      // Облачко сообщения (relative для точного позиционирования времени внизу)
      const bubble = document.createElement('div');
      bubble.className = `relative rounded-2xl px-3 py-1.5 shadow-sm break-words max-w-full select-text ${
        isMe 
          ? 'bg-blue-600 text-white rounded-br-none shadow-blue-600/20' 
          : 'bg-slate-800 text-slate-100 rounded-bl-none border border-slate-700'
      }`;

      // В групповых чатах отображаем ник отправителя вверху бабла (для собеседников)
      if (currentChatType === 'group' && !isMe && msg.sender_username) {
        const colors = ['text-sky-400', 'text-emerald-400', 'text-amber-400', 'text-purple-400', 'text-pink-400', 'text-cyan-400', 'text-rose-400'];
        let hash = 0;
        for (let i = 0; i < msg.sender_username.length; i++) {
          hash = msg.sender_username.charCodeAt(i) + ((hash << 5) - hash);
        }
        const color = colors[Math.abs(hash) % colors.length];

        const authorDiv = document.createElement('div');
        authorDiv.className = `text-[11px] font-bold ${color} mb-0.5 leading-tight select-none`;
        authorDiv.innerText = msg.sender_username;
        bubble.appendChild(authorDiv);
      }

      // Текст сообщения с кликабельными ссылками
      const textSpan = document.createElement('span');
      textSpan.className = 'text-sm leading-relaxed whitespace-pre-wrap select-text';
      const urls = renderFormattedText(textSpan, msg.content, isMe);
      bubble.appendChild(textSpan);

      // Распорка-невидимка (spacer), чтобы длинный текст не накладывался на время в правом нижнем углу
      const spacer = document.createElement('span');
      spacer.className = `inline-block ${isMe ? 'w-14' : 'w-10'} h-3 pointer-events-none`;
      bubble.appendChild(spacer);

      // Время и статус (галочки) - строго в правом нижнем углу облачка
      const metaSpan = document.createElement('span');
      metaSpan.className = `absolute bottom-1 right-2.5 inline-flex items-center gap-1 text-[10px] select-none font-mono leading-none ${
        isMe ? 'text-blue-200' : 'text-slate-400'
      }`;

      // Превью для медиа (eblo.id, imgur, youtube, прямые картинки)
      attachMediaPreviews(bubble, metaSpan, urls);

      if (timeStr) {
        const timeSpan = document.createElement('span');
        timeSpan.innerText = timeStr;
        metaSpan.appendChild(timeSpan);
      }

      if (isMe) {
        const statusSpan = document.createElement('span');
        statusSpan.className = 'msg-status font-bold ' + (msg.is_read ? 'text-cyan-300' : 'text-blue-300/70');
        statusSpan.innerText = msg.is_read ? '✓✓' : '✓';
        statusSpan.title = msg.is_read ? 'Прочитано' : 'Отправлено';
        metaSpan.appendChild(statusSpan);
      }

      bubble.appendChild(metaSpan);

      if (isMe) {
        row.appendChild(bubble);
        row.appendChild(avatar);
      } else {
        row.appendChild(avatar);
        row.appendChild(bubble);
      }

      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    // Отправка сообщения
    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !ws || !currentChatId) return;

      ws.send(JSON.stringify({
        chat_id: currentChatId,
        content: text
      }));

      input.value = '';
    }
  </script>
